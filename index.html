<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="TrustLens digital trust and cybersecurity intelligence workspace.">
  <title>TrustLens — Digital Trust Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview" aria-label="TrustLens overview"><span class="brand-mark">T</span><span class="brand-copy">TRUST<span>LENS</span><small>INTELLIGENCE PLATFORM</small></span></a>
      <div class="workspace-switch"><span class="workspace-avatar">N</span><span><b>Northstar workspace</b><small>Enterprise · Demo</small></span><span class="chevron">⌄</span></div>
      <div class="nav-caption">WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span>Command center</button>
        <div class="nav-caption nav-divider">INTELLIGENCE MODULES</div>
        <button class="nav-item" data-view="media"><span class="nav-icon">◈</span>Media forensics<span class="nav-hint">01</span></button>
        <button class="nav-item" data-view="threat"><span class="nav-icon">⌁</span>Threat analyzer<span class="nav-hint">02</span></button>
        <button class="nav-item" data-view="osint"><span class="nav-icon">◎</span>Identity intelligence<span class="nav-hint">03</span></button>
        <button class="nav-item" data-view="graph"><span class="nav-icon">⌘</span>TrustGraph<span class="nav-hint">04</span></button>
        <button class="nav-item" data-view="score"><span class="nav-icon">◉</span>Trust score<span class="nav-hint">05</span></button>
        <div class="nav-caption nav-divider">OPERATIONS</div>
        <button class="nav-item" data-view="reports"><span class="nav-icon">▤</span>Investigations & reports</button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="demo-notice"><span class="status-pulse"></span><span><b>Simulation environment</b><small>No live threat intelligence</small></span></div>
        <div class="profile-row"><span class="profile-avatar">TL</span><span><b>TrustLens Admin</b><small>Workspace administrator</small></span><button class="icon-button" data-view="settings" aria-label="Open settings">···</button></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="menuBtn" aria-label="Toggle navigation">☰</button>
        <div class="breadcrumbs"><span>Workspace</span><span class="crumb-slash">/</span><b id="crumb">Command center</b></div>
        <div class="top-actions">
          <label class="global-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search investigations..." aria-label="Search investigations"><kbd>⌘ K</kbd></label>
          <span class="env-badge"><i></i> SIMULATED</span>
          <button class="icon-button notification-button" id="notificationsBtn" aria-label="Notifications">♧<i></i></button>
          <button class="profile-avatar top-profile" data-view="settings" aria-label="Open settings">TL</button>
        </div>
      </header>
      <section class="page-content" id="viewRoot" aria-live="polite"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="filePicker" hidden multiple>
  <script src="app.js"></script>
</body>
</html>
